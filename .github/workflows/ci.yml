name: SIAJAR CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'fitur-*'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-test:
    name: Verify, Database & E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Row-Level Security (RLS) Verification
        run: npm run check:rls

      - name: Vitest Unit & Integration Tests
        run: npm test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Local Supabase Engine
        run: supabase start

      - name: Reset Database and Apply All Migrations
        run: supabase db reset

      - name: Run pgTAP Database Policies & RLS Tests
        run: supabase test db

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_for_ci
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_service_for_ci

      - name: Install Playwright Browsers and Dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright End-to-End Tests
        run: npx playwright test
        env:
          CI: true
