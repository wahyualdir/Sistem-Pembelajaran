name: SIAJAR CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'fitur-*'
      - 'seed-akademik-*'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-test:
    name: Verify, Database & E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Row-Level Security (RLS) Verification
        run: npm run check:rls

      - name: Vitest Unit & Integration Tests
        run: npm test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Local Supabase Engine
        run: supabase start

      - name: Reset Database and Apply All Migrations
        run: supabase db reset

      - name: Run pgTAP Database Policies & RLS Tests
        run: supabase test db

      - name: Export Supabase Local Environment
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> $GITHUB_ENV
          echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV

      - name: Seed Academic Data (UIR TI 2026/2027) & Verify
        run: npm run seed:akademik -- --apply
        env:
          SEED_ENV: local
          SEED_CONFIRM_PROJECT_REF: local
          SEED_PASSWORD: "ci-temporary-seed-password-2026"
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install Playwright Browsers and Dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright End-to-End Tests
        run: npx playwright test
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
